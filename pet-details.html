<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pet Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container mt-4">
    <a href="index.html" class="btn btn-secondary mb-3">Back to Main Page</a>
    <div class="row">
        <div class="col-md-6">
            <img id="pet-image" class="img-fluid" alt="Pet Image">
        </div>
        <div class="col-md-6">
            <h2 id="pet-name"></h2>
            <p><strong>Breed:</strong> <span id="pet-breed"></span></p>
            <p><strong>Age:</strong> <span id="pet-age"></span> years</p>
            <p><strong>Gender:</strong> <span id="pet-gender"></span></p>
            <p><strong>Description:</strong> <span id="pet-description"></span></p>
        </div>
    </div>
</div>

<script src="pet-details.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
