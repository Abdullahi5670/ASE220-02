<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pet Shelter Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"> <!-- Theme Styles -->
    <link rel="stylesheet" href="styles.css"> <!-- Custom Styles -->
</head>
<body>

<header class="text-center p-4 bg-light">
    <h1>Available Pets</h1>
</header>

<div class="container mt-4">
    <div class="row row-cols-1 row-cols-md-3 g-4" id="pets-container">
        <!-- Pets will load dynamically -->
    </div>
    <div class="text-center mt-3">
        <button id="load-more" class="btn btn-primary">Load More</button>
        <button id="create-pet" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createPetModal">Create Pet</button>
    </div>
</div>

<!-- Pet Details Modal -->
<div class="modal fade" id="petModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>
</div>

<!-- Create Pet Modal -->
<div class="modal fade" id="createPetModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add a New Pet</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="create-pet-form">
                    <input type="text" id="pet-name" placeholder="Name" required class="form-control mb-2">
                    <input type="text" id="pet-type" placeholder="Type (Dog/Cat)" required class="form-control mb-2">
                    <input type="text" id="pet-breed" placeholder="Breed" required class="form-control mb-2">
                    <input type="number" id="pet-age" placeholder="Age" required class="form-control mb-2">
                    <input type="text" id="pet-gender" placeholder="Gender" required class="form-control mb-2">
                    <button type="submit" class="btn btn-success">Save Pet</button>
                </form>
            </div>
        </div>
    </div>
</div>


<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
